name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── STAGE 1: Quality (web + contracts, in parallel) ────────────────────────
  web-quality:
    name: "Stage 1 · Web Quality"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full matrix on main push, single Node on PRs
        node-version: ${{ github.event_name == 'push' && fromJSON('[22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Unit + property tests with coverage (vitest, 20,000 fast-check cases)
        run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  contracts:
    name: "Stage 1 · Contracts (Foundry)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # forge-std
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build (with sizes)
        run: forge build --sizes
      - name: Test (12 tests incl. fuzz + invariants I1/I3)
        run: forge test -vv
      - name: Gas snapshot (advisory)
        run: forge snapshot --check || forge snapshot
        continue-on-error: true

  # ── STAGE 2: Security gate (parallel with Stage 1) ─────────────────────────
  dependency-audit:
    name: "Stage 2 · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: License compliance
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --summary
        continue-on-error: true

  secret-scan:
    name: "Stage 2 · Secret Scanning (gitleaks, full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── STAGE 3: Build verification ────────────────────────────────────────────
  build:
    name: "Stage 3 · Build Verification"
    needs: [web-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build (vite)
        run: npm run build
      - name: Bundle budget
        run: |
          JS=$(du -sk dist/assets/*.js | awk '{s+=$1} END {print s}')
          echo "JS in dist/assets: ${JS}KB"
          test -f dist/og-image.png && test -f dist/index.html
          if [ "$JS" -gt 600 ]; then echo "::error::JS ${JS}KB exceeds 600KB"; exit 1
          elif [ "$JS" -gt 400 ]; then echo "::warning::JS ${JS}KB exceeds 400KB budget"
          else echo "✅ within budget"; fi
      - name: Submission readiness (no placeholders in judge-facing docs)
        run: python3 scripts/check_submission_readiness.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── STAGE 4: E2E ───────────────────────────────────────────────────────────
  e2e:
    name: "Stage 4 · E2E (Playwright, read-only vs Arc mainnet)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── STAGE 5: Performance ───────────────────────────────────────────────────
  performance:
    name: "Stage 5 · Performance (Lighthouse CI)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun
        continue-on-error: true # advisory

  # ── STAGE 6: Deploy gate + GitHub Pages ────────────────────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy Gate"
    needs: [build, contracts, e2e, performance, dependency-audit, secret-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - run: |
          echo "🚀 All gates passed"
          echo "  ✅ Stage 1 — Web Quality (oxlint, tsc, vitest + fast-check)"
          echo "  ✅ Stage 1 — Contracts (forge build + test)"
          echo "  ✅ Stage 2 — Dependency Audit · Secret Scanning"
          echo "  ✅ Stage 3 — Build + bundle budget + readiness"
          echo "  ✅ Stage 4 — E2E (Playwright)"
          echo "  ✅ Stage 5 — Performance (Lighthouse)"

  deploy-pages:
    name: "Deploy · GitHub Pages (gh-pages branch, same URL)"
    needs: [deploy-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pigeonhole.edycu.dev
          commit_message: "deploy pigeonhole ${{ github.sha }}"
