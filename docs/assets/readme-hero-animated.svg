  </defs>
  <style>
    @keyframes driftA { from { transform: translate(0,0) } to { transform: translate(90px,30px) } }
    @keyframes driftB { from { transform: translate(0,0) } to { transform: translate(-70px,-24px) } }
    @keyframes pulse { 0%,100% { opacity: .78 } 50% { opacity: 1 } }
    @keyframes breathe { 0%,52% { opacity: 0 } 60% { opacity: .25 } 80% { opacity: .1 } 94%,100% { opacity: 0 } }
    .a1 { animation: driftA 17s ease-in-out infinite alternate; }
    .a2 { animation: driftB 14s ease-in-out infinite alternate; }
    .metric { animation: pulse 8s ease-in-out infinite; }
    .breath { animation: breathe 8s linear infinite; }
    [data-story] { will-change: opacity; }
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

