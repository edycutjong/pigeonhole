<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Pigeonhole — A throwaway contract is born at the blue codeless address, sweeps its USDC green into the treasury, and vanishes.">
<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-8%    steady state: plate + grid + aurora, mark, outlined wordmark, tagline, metric, tech line; the rack of four slots (blue = held),
                        slot inv-0043 labelled UNPAID, the green treasury bar. Poster-safe: every brand element at opacity 1.
  8-22%   trigger:      a payment comet flies from the right edge into slot inv-0043; a coin appears in the slot; label flips to PAID,
                        caption "PAID — one eth_getLogs on the system emitter".                                    data-story="beat-2"
  22-52%  mechanism:    A throwaway contract is born at the blue codeless address, sweeps its USDC green into the treasury, and vanishes.   data-story="beat-3"
                        (green outline flashes on the slot = born; the slot's bottom edge opens; the coin drops into the bar turning green;
                        caption "sweep(salt) · 22 bytes born · SELFDESTRUCT → treasury · gone")
  52-80%  resolution:   bar glows; label flips to SWEPT · empty · reusable; the slot stays open. Residue persists to 94%.  data-story="beat-4"
  80-100% breathe + seam fade: story captions fade 94-97%; the bottom edge returns 94-96%; frame 0 ≈ frame 100.
-->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ea1ff"/><stop offset="1" stop-color="#7cc0ff"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="aurora" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="coinGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="barGlow" x="-10%" y="-150%" width="120%" height="400%"><feGaussianBlur stdDeviation="12"/></filter>
