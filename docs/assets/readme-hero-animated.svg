  <text class="sans" x="160" y="150" font-size="18" fill="#c3ccd6">A fresh USDC deposit address per invoice —</text>
  <text class="sans" x="160" y="174" font-size="18" fill="#c3ccd6" font-weight="600">with no private key to guard.</text>
  <text class="mono metric" x="160" y="214" font-size="18" fill="#3ddc84">$0.0013 per sweep · 64,162 gas · 0 keys</text>
  <text class="mono" x="160" y="242" font-size="11" fill="#8592a0">Arc mainnet 5042 · native USDC · no backend, no database</text>
  <text class="mono" x="160" y="262" font-size="11" fill="#8592a0">CREATE2 · SELFDESTRUCT · EIP-7708 logs · 33 tests · MIT</text>
  <text class="mono" x="160" y="282" font-size="11" fill="#8592a0">factory 0x942b8c10…9A40 · github.io/pigeonhole-arc</text>

